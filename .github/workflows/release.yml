name: release

# Builds this repo's two images and pushes them to GHCR. It mirrors the two image build jobs
# in .gitlab-ci.yml (build:sync + build:nginx), which publish to the in-cluster registry.
#
#   ghcr.io/hugmesh/hugmesh-remote-fragment         the sync sidecar (Maven build, Dockerfile)
#   ghcr.io/hugmesh/hugmesh-remote-fragment/nginx   the static server (nginx/Dockerfile)
#
# Both images carry the same version: pom.xml <project><version>. The first job, `version`,
# runs scripts/release-version.sh once per image and refuses anything not listed here.
#
#   push to main                     :main and :sha-<12> on both images. Never a version tag,
#                                    never :latest.
#   push of tag v<version>           :<version>, :beta and :sha-<12> on both images, plus a
#                                    GitHub Release marked prerelease and not latest. The tag
#                                    must equal "v" + the pom version, and <version> must not
#                                    exist in GHCR yet: a published beta is never overwritten.
#   workflow_dispatch on a v* tag    the same as the tag push (the re-run path); the GitHub
#                                    Release step is skipped if the release already exists.
#   workflow_dispatch on main        the same as a push to main.
#   anything else                    refused by the version job; nothing is pushed.
#
# There is no pull_request trigger, and there must never be one: this workflow holds
# packages:write and can run on the self-hosted runner.
#
# RUNNER. Every job uses the same runs-on line. It picks the JSON array in the repository
# variable RUNS_ON_PUBLISH (for example ["self-hosted","Linux","X64"]) ONLY for a non-PR event
# on refs/heads/main or a v*/studio-v* tag; in every other case, or when RUNS_ON_PUBLISH is
# unset or empty, it runs on GitHub-hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH is the off
# switch. This line keeps our own runs off the local runner; it is NOT a security boundary
# against a fork (a fork's PR runs the fork's workflow file). Runner-group settings are.
#
# ORDER. build-nginx runs after build-sync, so a release whose Maven build fails pushes no
# version tag at all. If build-sync succeeded and build-nginx failed, use "Re-run failed jobs":
# build-nginx checks only its own image, so it can still publish the same version.
#
# PRIVATE LIBRARIES. The sync image's Maven build resolves net.hugmesh:hugmesh-commons
# (2.2.0-beta.1, whose own parent chain is hugmesh-parent and hugmesh-build-config) from
# GitHub Packages through .github/maven-ci-settings.xml, selected by the BuildKit secret
# `packages_read_token` (see the Dockerfile). GitHub Packages Maven needs a token even to read
# a public package, so the PACKAGES_READ_TOKEN secret stays after the repository goes public.
# Those betas must be published by the release chain (build-config -> parent -> commons)
# before this workflow can build the sync image; until then the preflight job fails by name.
# The repo-root settings.xml (GitLab registry) is not used here; it stays for GitLab CI.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SYNC_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment
  NGINX_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment/nginx

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      kind: ${{ steps.sync.outputs.kind }}
      version: ${{ steps.sync.outputs.version }}
      sha12: ${{ steps.sync.outputs.sha12 }}
      sync_tags: ${{ steps.sync.outputs.tags }}
      nginx_tags: ${{ steps.nginx.outputs.tags }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The guard and this workflow's shape are tested before the guard is trusted.
      - name: Test the version guard and the workflow shape
        run: |
          bash scripts/test-release-version.sh
          bash scripts/test-release-workflow.sh

      - name: Version guard, sync image
        id: sync
        env:
          IMAGE: ${{ env.SYNC_IMAGE }}
        run: bash scripts/release-version.sh

      - name: Version guard, nginx image
        id: nginx
        env:
          IMAGE: ${{ env.NGINX_IMAGE }}
        run: bash scripts/release-version.sh

  preflight:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      # PREFLIGHT, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the PRIVATE GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons, auth-core), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

  build-sync:
    needs: [version, preflight]
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A published version is immutable. Only "not found" lets a release run continue; any
      # other answer (the tag exists, or the registry could not be asked) stops it, so a
      # failed lookup can never turn into an overwrite.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.SYNC_IMAGE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          ref="${IMAGE}:${VERSION}"
          out=$(docker buildx imagetools inspect "${ref}" 2>&1)
          rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::${ref} already exists in GHCR. A published version is never overwritten: raise the -beta.N in pom.xml, merge, and tag the new version."
            exit 1
          fi
          case "${out}" in
            *"not found"*|*"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"name unknown"*|*"NAME_UNKNOWN"*)
              echo "  ${ref} is not published yet; continuing."
              ;;
            *)
              printf '%s\n' "${out}"
              echo "::error::could not tell whether ${ref} exists (exit ${rc}, output above). Refusing to push rather than risk overwriting it. If ${IMAGE} has never been pushed at all, GHCR may answer 'denied' instead of 'not found': let the main build run first (merge to main, or a manual run on main) so the package exists, then re-run this tag."
              exit 1
              ;;
          esac

      - name: Build and push sync sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          tags: ${{ needs.version.outputs.sync_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.kind == 'release' && needs.version.outputs.version || 'main' }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret (never an ARG/ENV): selects .github/maven-ci-settings.xml, i.e.
          # the net.hugmesh libraries come from GitHub Packages. See the Dockerfile.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

  build-nginx:
    needs: [version, build-sync]
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same rule as build-sync, for this job's own image.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.NGINX_IMAGE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          ref="${IMAGE}:${VERSION}"
          out=$(docker buildx imagetools inspect "${ref}" 2>&1)
          rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::${ref} already exists in GHCR. A published version is never overwritten: raise the -beta.N in pom.xml, merge, and tag the new version."
            exit 1
          fi
          case "${out}" in
            *"not found"*|*"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"name unknown"*|*"NAME_UNKNOWN"*)
              echo "  ${ref} is not published yet; continuing."
              ;;
            *)
              printf '%s\n' "${out}"
              echo "::error::could not tell whether ${ref} exists (exit ${rc}, output above). Refusing to push rather than risk overwriting it. If ${IMAGE} has never been pushed at all, GHCR may answer 'denied' instead of 'not found': let the main build run first (merge to main, or a manual run on main) so the package exists, then re-run this tag."
              exit 1
              ;;
          esac

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: nginx
          file: nginx/Dockerfile
          push: true
          pull: true
          tags: ${{ needs.version.outputs.nginx_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.kind == 'release' && needs.version.outputs.version || 'main' }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    needs: [version, build-sync, build-nginx]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release (prerelease and never latest for a beta)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA12: ${{ needs.version.outputs.sha12 }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; not touching it."
            exit 0
          fi
          flags=(--verify-tag --title "${tag}")
          case "${VERSION}" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          notes="Images: ${SYNC_IMAGE}:${VERSION} and ${NGINX_IMAGE}:${VERSION} (also :sha-${SHA12}). Built from ${GITHUB_SHA}."
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}" --notes "${notes}"
