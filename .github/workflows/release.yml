name: release

# Builds this repo's two images and pushes them to GHCR. It mirrors the two image build jobs
# in .gitlab-ci.yml (build:sync + build:nginx), which publish to the in-cluster registry.
#
#   ghcr.io/hugmesh/hugmesh-remote-fragment         the sync sidecar (Maven build, Dockerfile)
#   ghcr.io/hugmesh/hugmesh-remote-fragment/nginx   the static server (nginx/Dockerfile)
#
# Both images carry the same version: pom.xml <project><version>. The first job, `version`,
# runs scripts/release-version.sh once per image and refuses anything not listed here.
#
# hugmesh-release-channels: beta+stable
# THE TAG DECIDES THE CHANNEL (scripts/release-version.sh, tested by
# scripts/test-release-version.sh; this file's own steps by scripts/test-release-workflow.py):
#
#   push to main                     :main and :sha-<12> on both images. Never a version tag,
#                                    never a floating channel tag.
#   push to release/X.Y              :sha-<12> only on both images (the same main-style run, so
#                                    the release script can require a green run at the branch
#                                    head). pom.xml must be X.Y.something.
#   push of tag vX.Y.Z-beta.N        BETA channel. Only for a commit on main. :X.Y.Z-beta.N,
#                                    :sha-<12> and the floating :beta on both images, plus a
#                                    GitHub Release marked prerelease and not latest.
#   push of tag vX.Y.Z               STABLE channel. Only for a commit on release/X.Y.
#                                    :X.Y.Z, :sha-<12>, the floating :X.Y and, only when X.Y is
#                                    the newest stable line among this repo's vA.B.C tags, the
#                                    floating latest tag, on both images; plus a full GitHub
#                                    Release, marked Latest in that same case (a patch on an
#                                    older line is not Latest).
#   any other v* tag (-rc.N, ...)    refused: the tag decides the channel and has none.
#
#   Every tag must equal "v" + the pom version, and <version> must not exist in GHCR yet: a
#   published :X.Y.Z / :X.Y.Z-beta.N is never overwritten, while :beta, :X.Y and latest move.
#   Every pushed tag names the one digest that is signed and attested in its image job.
#   "Re-run failed jobs" reuses the version job's answer, so each image job asks the guard
#   again right before its build and refuses if the answer changed, and the GitHub Release is
#   only marked Latest if that still holds when the Release is created.
#   workflow_dispatch on a v* tag    the same as the tag push (the re-run path); the GitHub
#                                    Release step is skipped if the release already exists.
#   workflow_dispatch on a branch    the same as a push to that branch.
#   anything else                    refused by the version job; nothing is pushed.
#
# There is no pull_request trigger, and there must never be one: this workflow holds
# packages:write and can run on the self-hosted runner.
#
# RUNNER. build-sync, build-nginx and notify-site run on GitHub-hosted ubuntu-latest, written
# literally: a published, signed image is never built on a self-hosted runner. version,
# preflight and github-release use the same runs-on line, which picks the JSON array in the repository
# variable RUNS_ON_PUBLISH (for example ["self-hosted","Linux","X64"]) ONLY for a non-PR event
# on refs/heads/main or a v*/studio-v* tag; in every other case (a release/X.Y push among them),
# or when RUNS_ON_PUBLISH is unset or empty, it runs on GitHub-hosted ubuntu-latest. Deleting
# RUNS_ON_PUBLISH is the off
# switch. This line keeps our own runs off the local runner; it is NOT a security boundary
# against a fork (a fork's PR runs the fork's workflow file). Runner-group settings are.
#
# ORDER. build-nginx runs after build-sync, so a release whose Maven build fails pushes no
# version tag at all. If build-sync succeeded and build-nginx failed, use "Re-run failed jobs":
# build-nginx checks only its own image, so it can still publish the same version.
#
# PRIVATE LIBRARIES. The sync image's Maven build resolves net.hugmesh:hugmesh-commons
# (2.2.0-beta.1, whose own parent chain is hugmesh-parent and hugmesh-build-config) from
# GitHub Packages through .github/maven-ci-settings.xml, selected by the BuildKit secret
# `packages_read_token` (see the Dockerfile). GitHub Packages Maven needs a token even to read
# a public package, so the PACKAGES_READ_TOKEN secret stays after the repository goes public.
# Those betas must be published by the release chain (build-config -> parent -> commons)
# before this workflow can build the sync image; until then the preflight job fails by name.
# The repo-root settings.xml (GitLab registry) is not used here; it stays for GitLab CI.

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SYNC_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment
  NGINX_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment/nginx

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      kind: ${{ steps.sync.outputs.kind }}
      version: ${{ steps.sync.outputs.version }}
      sha12: ${{ steps.sync.outputs.sha12 }}
      sync_tags: ${{ steps.sync.outputs.tags }}
      nginx_tags: ${{ steps.nginx.outputs.tags }}
      channel: ${{ steps.sync.outputs.channel }}
      latest: ${{ steps.sync.outputs.latest }}
    steps:
      # fetch-depth: 0 brings origin/main, every origin/release/* and every tag: the guard
      # needs them to prove which branch a tag is on and which stable line is the newest.
      # A shallow checkout makes the guard refuse (fail closed), never guess.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The guard and this workflow are tested before the guard is trusted. The .py test runs
      # this file's own signref check, overwrite guard, re-check, digest check and GitHub
      # Release flags for every channel.
      - name: Test the version guard and the workflow shape
        run: |
          bash scripts/test-release-version.sh
          bash scripts/test-release-workflow.sh
          python3 scripts/test-release-workflow.py

      - name: Version guard, sync image
        id: sync
        env:
          IMAGE: ${{ env.SYNC_IMAGE }}
        run: bash scripts/release-version.sh

      - name: Version guard, nginx image
        id: nginx
        env:
          IMAGE: ${{ env.NGINX_IMAGE }}
        run: bash scripts/release-version.sh

      # Both guard runs read the same ref, commit, pom and tags, so everything but the tag list
      # must agree; the jobs below take channel and latest from the sync run.
      - name: The two guard runs agree
        env:
          SYNC: ${{ steps.sync.outputs.kind }} ${{ steps.sync.outputs.version }} ${{ steps.sync.outputs.channel }} ${{ steps.sync.outputs.latest }}
          NGINX: ${{ steps.nginx.outputs.kind }} ${{ steps.nginx.outputs.version }} ${{ steps.nginx.outputs.channel }} ${{ steps.nginx.outputs.latest }}
        run: |
          set -euo pipefail
          if [ "${SYNC}" != "${NGINX}" ]; then
            echo "::error::the version guard answered '${SYNC}' for the sync image but '${NGINX}' for the nginx image (kind version channel latest). Nothing is published."
            exit 1
          fi
          echo "  both images: ${SYNC}"

  preflight:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      # PREFLIGHT, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the PRIVATE GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons, auth-core), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

  build-sync:
    needs: [version, preflight]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # fetch-depth: 0 for "Re-check the floating tags against origin", which runs the version
      # guard again.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A published version is immutable. Only "not found" lets a release run continue; any
      # other answer (the tag exists, or the registry could not be asked) stops it, so a
      # failed lookup can never turn into an overwrite.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.SYNC_IMAGE }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -uo pipefail
          # Only the exact version is immutable. The floating :beta, :X.Y and latest tags are
          # meant to move, so they are never checked here.
          ref="${IMAGE}:${VERSION}"
          # The step runs under bash -e: a bare failing $(...) would end it before rc is read,
          # so "not found" (every first publish) would kill the run instead of continuing.
          rc=0
          out=$(docker buildx imagetools inspect "${ref}" 2>&1) || rc=$?
          if [ "${rc}" -eq 0 ]; then
            if [ "${CHANNEL}" = "stable" ]; then
              echo "::error::${ref} already exists in GHCR. A published version is never overwritten: fix forward with the next patch (raise X.Y.Z on release/X.Y), merge, and tag the new version."
            else
              echo "::error::${ref} already exists in GHCR. A published version is never overwritten: raise the -beta.N in pom.xml, merge, and tag the new version."
            fi
            exit 1
          fi
          case "${out}" in
            *"not found"*|*"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"name unknown"*|*"NAME_UNKNOWN"*)
              echo "  ${ref} is not published yet; continuing."
              ;;
            *)
              printf '%s\n' "${out}"
              echo "::error::could not tell whether ${ref} exists (exit ${rc}, output above). Refusing to push rather than risk overwriting it. If ${IMAGE} has never been pushed at all, GHCR may answer 'denied' instead of 'not found': let the main build run first (merge to main, or a manual run on main) so the package exists, then re-run this tag."
              exit 1
              ;;
          esac

      # :X.Y and latest depend on which stable tags exist, and the version job's answer can be
      # old: "Re-run failed jobs" reuses it however much later that happens. Without this check,
      # re-running v0.3.0 after v0.4.0 published would move latest back to 0.3.0. Ask the same
      # guard again from the tags on origin now, the last thing before the build. Any difference
      # stops the run with nothing pushed, and a "Re-run all jobs" decides afresh. The build
      # itself still takes minutes, and a registry has no compare-and-swap, so a tag pushed in
      # that window is not seen here.
      - name: Re-check the floating tags against origin
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.SYNC_IMAGE }}
          WANT_TAGS: ${{ needs.version.outputs.sync_tags }}
          WANT_LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          git fetch --quiet --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          rc=0
          fresh="$(GITHUB_OUTPUT='' bash scripts/release-version.sh 2>&1)" || rc=$?
          if [ "${rc}" -ne 0 ]; then
            printf '%s\n' "${fresh}"
            echo "::error::the version guard accepted this release earlier and refuses it now (output above). Nothing was pushed."
            exit 1
          fi
          got_tags=""
          got_latest=""
          while IFS= read -r line; do
            case "${line}" in
              tags=*) got_tags="${line#tags=}" ;;
              latest=*) got_latest="${line#latest=}" ;;
            esac
          done <<< "${fresh}"
          if [ "${got_tags}" != "${WANT_TAGS}" ] || [ "${got_latest}" != "${WANT_LATEST}" ]; then
            echo "::error::the version job chose tags ${WANT_TAGS} (latest=${WANT_LATEST}), but the tags on origin now give ${got_tags} (latest=${got_latest}). Nothing was pushed. Use 'Re-run all jobs', not 'Re-run failed jobs', so the version job decides again."
            exit 1
          fi
          echo "  floating tags still correct: ${got_tags} (latest=${got_latest})"

      - name: Build and push sync sidecar image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          pull: true
          tags: ${{ needs.version.outputs.sync_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.kind == 'release' && needs.version.outputs.version || github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret (never an ARG/ENV): selects .github/maven-ci-settings.xml, i.e.
          # the net.hugmesh libraries come from GitHub Packages. See the Dockerfile.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          EXPECTED_TAGS: ${{ needs.version.outputs.sync_tags }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          # Signing and both attestations are by DIGEST, so they cover every tag that names
          # this digest. Prove the pushed tags are exactly the ones the version guard chose:
          # nothing more was pushed unsigned, nothing less was signed.
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split(",") if t.strip())
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the guard's tags {expected}")
          channel = os.environ.get("CHANNEL", "")
          # A missing VERSION reads as a prerelease ("-"), and so does an empty one (a job
          # output that was never set arrives as ""), so this fails closed.
          if "latest" in tags and "-" in (os.environ.get("VERSION") or "-"):
              sys.exit("::error::a tag named latest was pushed; beta images must never be tagged latest")
          if "latest" in tags and channel != "stable":
              sys.exit("::error::a tag named latest was pushed outside the stable channel")
          if "beta" in tags and channel != "beta":
              sys.exit("::error::a tag named beta was pushed outside the beta channel")
          if channel != "stable" and any(re.fullmatch(r"[0-9]+\.[0-9]+", t) for t in tags):
              sys.exit("::error::a floating X.Y tag was pushed outside the stable channel")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest}; it covers every pushed tag: {', '.join(sorted(tags))}")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag that resolves
      # to it. Prove each pushed tag does (a floating tag moved by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ needs.version.outputs.sync_tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a refs <<< "${TAGS}"
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no pushed tags to check"
            exit 1
          fi
          for ref in "${refs[@]}"; do
            # A digest is the sha256 of the manifest's exact bytes, which --raw prints. Do not
            # use --format '{{.Manifest.Digest}}': buildx answers any format that starts with
            # {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "${ref}" --raw | sha256sum)"; then
              echo "::error::could not read ${ref} from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${ref} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
            echo "  ${ref} -> ${DIGEST} (signed)"
          done

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
          TAGS: ${{ needs.version.outputs.sync_tags }}
        run: |
          {
            echo "### Signed image"
            echo "Every tag below names this one signed, attested digest: ${TAGS}"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/.*|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-nginx:
    needs: [version, build-sync]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # fetch-depth: 0 for "Re-check the floating tags against origin", which runs the version
      # guard again.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same rule as build-sync, for this job's own image.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.NGINX_IMAGE }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -uo pipefail
          # Only the exact version is immutable. The floating :beta, :X.Y and latest tags are
          # meant to move, so they are never checked here.
          ref="${IMAGE}:${VERSION}"
          # The step runs under bash -e: a bare failing $(...) would end it before rc is read,
          # so "not found" (every first publish) would kill the run instead of continuing.
          rc=0
          out=$(docker buildx imagetools inspect "${ref}" 2>&1) || rc=$?
          if [ "${rc}" -eq 0 ]; then
            if [ "${CHANNEL}" = "stable" ]; then
              echo "::error::${ref} already exists in GHCR. A published version is never overwritten: fix forward with the next patch (raise X.Y.Z on release/X.Y), merge, and tag the new version."
            else
              echo "::error::${ref} already exists in GHCR. A published version is never overwritten: raise the -beta.N in pom.xml, merge, and tag the new version."
            fi
            exit 1
          fi
          case "${out}" in
            *"not found"*|*"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"name unknown"*|*"NAME_UNKNOWN"*)
              echo "  ${ref} is not published yet; continuing."
              ;;
            *)
              printf '%s\n' "${out}"
              echo "::error::could not tell whether ${ref} exists (exit ${rc}, output above). Refusing to push rather than risk overwriting it. If ${IMAGE} has never been pushed at all, GHCR may answer 'denied' instead of 'not found': let the main build run first (merge to main, or a manual run on main) so the package exists, then re-run this tag."
              exit 1
              ;;
          esac

      # :X.Y and latest depend on which stable tags exist, and the version job's answer can be
      # old: "Re-run failed jobs" reuses it however much later that happens. Without this check,
      # re-running v0.3.0 after v0.4.0 published would move latest back to 0.3.0. Ask the same
      # guard again from the tags on origin now, the last thing before the build. Any difference
      # stops the run with nothing pushed, and a "Re-run all jobs" decides afresh. The build
      # itself still takes minutes, and a registry has no compare-and-swap, so a tag pushed in
      # that window is not seen here.
      - name: Re-check the floating tags against origin
        if: needs.version.outputs.kind == 'release'
        env:
          IMAGE: ${{ env.NGINX_IMAGE }}
          WANT_TAGS: ${{ needs.version.outputs.nginx_tags }}
          WANT_LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          git fetch --quiet --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          rc=0
          fresh="$(GITHUB_OUTPUT='' bash scripts/release-version.sh 2>&1)" || rc=$?
          if [ "${rc}" -ne 0 ]; then
            printf '%s\n' "${fresh}"
            echo "::error::the version guard accepted this release earlier and refuses it now (output above). Nothing was pushed."
            exit 1
          fi
          got_tags=""
          got_latest=""
          while IFS= read -r line; do
            case "${line}" in
              tags=*) got_tags="${line#tags=}" ;;
              latest=*) got_latest="${line#latest=}" ;;
            esac
          done <<< "${fresh}"
          if [ "${got_tags}" != "${WANT_TAGS}" ] || [ "${got_latest}" != "${WANT_LATEST}" ]; then
            echo "::error::the version job chose tags ${WANT_TAGS} (latest=${WANT_LATEST}), but the tags on origin now give ${got_tags} (latest=${got_latest}). Nothing was pushed. Use 'Re-run all jobs', not 'Re-run failed jobs', so the version job decides again."
            exit 1
          fi
          echo "  floating tags still correct: ${got_tags} (latest=${got_latest})"

      - name: Build and push nginx image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: nginx
          file: nginx/Dockerfile
          push: true
          pull: true
          tags: ${{ needs.version.outputs.nginx_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.kind == 'release' && needs.version.outputs.version || github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          EXPECTED_TAGS: ${{ needs.version.outputs.nginx_tags }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          # Signing and both attestations are by DIGEST, so they cover every tag that names
          # this digest. Prove the pushed tags are exactly the ones the version guard chose:
          # nothing more was pushed unsigned, nothing less was signed.
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split(",") if t.strip())
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the guard's tags {expected}")
          channel = os.environ.get("CHANNEL", "")
          # A missing VERSION reads as a prerelease ("-"), and so does an empty one (a job
          # output that was never set arrives as ""), so this fails closed.
          if "latest" in tags and "-" in (os.environ.get("VERSION") or "-"):
              sys.exit("::error::a tag named latest was pushed; beta images must never be tagged latest")
          if "latest" in tags and channel != "stable":
              sys.exit("::error::a tag named latest was pushed outside the stable channel")
          if "beta" in tags and channel != "beta":
              sys.exit("::error::a tag named beta was pushed outside the beta channel")
          if channel != "stable" and any(re.fullmatch(r"[0-9]+\.[0-9]+", t) for t in tags):
              sys.exit("::error::a floating X.Y tag was pushed outside the stable channel")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest}; it covers every pushed tag: {', '.join(sorted(tags))}")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag that resolves
      # to it. Prove each pushed tag does (a floating tag moved by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ needs.version.outputs.nginx_tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a refs <<< "${TAGS}"
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no pushed tags to check"
            exit 1
          fi
          for ref in "${refs[@]}"; do
            # A digest is the sha256 of the manifest's exact bytes, which --raw prints. Do not
            # use --format '{{.Manifest.Digest}}': buildx answers any format that starts with
            # {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "${ref}" --raw | sha256sum)"; then
              echo "::error::could not read ${ref} from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${ref} resolves to ${got}, not the signed digest ${DIGEST}"
              exit 1
            fi
            echo "  ${ref} -> ${DIGEST} (signed)"
          done

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
          TAGS: ${{ needs.version.outputs.nginx_tags }}
        run: |
          {
            echo "### Signed image"
            echo "Every tag below names this one signed, attested digest: ${TAGS}"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/.*|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, build-sync, build-nginx]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      # The guard and every tag, to ask whether this release may still be marked Latest. The
      # Release only needs GH_TOKEN, so the write token is not left in the checkout.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the GitHub Release (beta prerelease never latest; stable latest only on the newest line)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.SYNC_IMAGE }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA12: ${{ needs.version.outputs.sha12 }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; not touching it."
            exit 0
          fi
          # LATEST=true means the image jobs moved the latest tag. That answer can be old (a
          # re-run of this job alone reuses it), so a newer stable taken since then keeps the
          # Latest mark where it is. This never fails the run: the images are already out, and a
          # re-run would stop at the overwrite guard, so a refusal here would leave no way to
          # make the Release. IMAGE (the sync image) is only the guard's required input; the
          # channel answer is the same for both images.
          if [ "${LATEST}" = "true" ]; then
            LATEST=false
            if fresh="$(GITHUB_OUTPUT='' bash scripts/release-version.sh 2>&1)"; then
              case $'\n'"${fresh}"$'\n' in
                *$'\n'latest=true$'\n'*) LATEST=true ;;
              esac
            else
              printf '%s\n' "${fresh}"
            fi
            if [ "${LATEST}" != "true" ]; then
              echo "::warning::${tag} is no longer the newest stable release; not marking this Release Latest."
            fi
          fi
          flags=(--verify-tag --title "${tag}")
          # The channel comes from the tag (the version guard); the suffix check is a second
          # lock so a prerelease can never be marked Latest.
          case "${CHANNEL}:${LATEST}:${VERSION}" in
            beta:false:*-*) flags+=(--prerelease --latest=false) ;;
            stable:true:*-*|stable:false:*-*) echo "::error::stable channel with prerelease version ${VERSION}"; exit 1 ;;
            stable:true:*) flags+=(--latest) ;;
            stable:false:*) flags+=(--latest=false) ;;
            *) echo "::error::no release flags for channel=${CHANNEL} latest=${LATEST} version=${VERSION}; refusing"; exit 1 ;;
          esac
          notes="Images: ${SYNC_IMAGE}:${VERSION} and ${NGINX_IMAGE}:${VERSION} (also :sha-${SHA12}). Built from ${GITHUB_SHA}."
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}" --notes "${notes}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
