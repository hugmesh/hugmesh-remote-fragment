name: release

# Manual-only release build. Deliberately NOT wired to push/tags — this stays fully
# inert until a human enables it. Mirrors the two image build jobs in this repo's
# .gitlab-ci.yml (build:sync + build:nginx), but publishes to GHCR instead of the
# in-cluster GitLab registry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the short commit SHA)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  SYNC_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment
  NGINX_IMAGE: ghcr.io/hugmesh/hugmesh-remote-fragment/nginx

jobs:
  build-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sync sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.SYNC_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.SYNC_IMAGE }}:latest

  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.NGINX_IMAGE }}:latest
