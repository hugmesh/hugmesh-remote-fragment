# HugMesh CI — build + push this repo's TWO container images to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — the Casdoor client_secret is supplied at runtime from the
# fragment-sync-casdoor Secret (ESO -> Vault), never baked in.
#
# This repo produces two images for ONE pod:
#   - $CI_REGISTRY_IMAGE      (the Spring-Native reactive sync sidecar; root Dockerfile)
#   - $CI_REGISTRY_IMAGE/nginx (the static nginx server; nginx/Dockerfile)
# The kustomize image rewrite (specs/cluster/manifests/remote-fragment) tracks the
# first-party sync image at :main; nginx uses the public nginxinc/nginx-unprivileged
# by default, but this nginx image is published for sites that prefer to pin the
# conf into an image rather than a ConfigMap.

# Pull in the centralized OWASP pen-test stage (hidden .pentest-* jobs) from the
# generator repo so this repo's pipeline gets the single-source-of-truth SCA +
# authenticated-ZAP DAST harness (probes + nuclei). The thin pentest:* jobs below
# `extends:` those hidden jobs. See memory hugmesh-pentest-standard.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [lint, test, build, pentest]

# Rule set shared by the three jobs that VERIFY but publish nothing
# (lint:deploy-manifest-drift, test, build:native).
#
# WHY THERE IS A BARE `$CI_COMMIT_BRANCH` RULE. The GitHub repo is PULL-MIRRORED
# into this GitLab, so a GitHub pull request never becomes a GitLab merge request
# and a mirror-sync pipeline always has CI_PIPELINE_SOURCE == "push". With only
# the first three rules a mirrored feature branch matched none of them, and since
# every job carried the same or a stricter set, GitLab created NO PIPELINE AT ALL
# for it: the jobs could only run after the change had landed on the default
# branch. The merge_request_event rule is kept for work opened directly in GitLab.
#
# Deliberately NOT applied to build:sync / build:nginx: those push tags into the
# container registry and must stay default-branch + tags only.
#
# CAVEAT, deliberately not pre-solved: merge_request_event plus a bare branch rule
# yields DUPLICATE pipelines (one branch, one MR) for a branch with an open GitLab
# merge request. Under pull-mirroring there are no GitLab merge requests, so no
# top-level `workflow:` block is added: a mis-stated one silently produces NO
# pipelines at all, which is far worse than a duplicate. If this repo ever moves
# to native GitLab merge requests, add GitLab's documented guard BEFORE that:
#   workflow:
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#       - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
#         when: never
#       - if: $CI_COMMIT_BRANCH
#       - if: $CI_COMMIT_TAG      # required: CI_COMMIT_BRANCH is unset on tags
.verify-rules: &verify_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_COMMIT_BRANCH'

# deploy/ vs central-manifest DRIFT guard. deploy/ + hugmesh-deploy.yaml are a
# copy of the reference cluster's central manifest, kept for the planned switch
# to a Forgejo-hosted catalog; the generator's specs/cluster/manifests/remote-fragment
# stays authoritative until then. Nothing renders the copy today, so it drifted
# silently three ways at once (a PodDisruptionBudget never copied across, the
# GitLab -> Harbor imagePullSecret migration, a renamed sibling repo) while
# `kubectl kustomize deploy/` kept exiting 0 — a resource nobody listed cannot be
# reported missing. Only a byte diff against the source can see that.
#
# Sparse-clones just that one manifest dir (~4 MB, no blobs) from the SAME org
# over ORG_BASE, derived from CI_REPOSITORY_URL, which carries the read-only CI
# job token — no secret committed (the generator's own cross-repo jobs reach
# their siblings the same way). A clone failure fails the job, on purpose: the
# guard exits 3 (INCOMPLETE) rather than passing with nothing to compare against.
lint:deploy-manifest-drift:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  variables:
    GENERATOR_ROOT: "${CI_PROJECT_DIR}/.central-manifest"
    GENERATOR_REF: "main"
  before_script:
    - apk add --no-cache bash git diffutils coreutils
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 --branch "${GENERATOR_REF}" --filter=blob:none --sparse "${ORG_BASE}/hugmesh-generator.git" "${GENERATOR_ROOT}"
    - git -C "${GENERATOR_ROOT}" sparse-checkout set specs/cluster/manifests/remote-fragment
  script:
    - bash scripts/check-deploy-drift.sh
  rules: *verify_rules

# JVM unit/integration tests. build:native `needs:` this job, so a test job that
# cannot pass is a native job that never runs. The job fails without each of
# these three things on the `docker run` line (each was wrong once; both failures
# below were reproduced by running the old line verbatim):
#   * `-s settings.xml`, plus CI_JOB_TOKEN / CI_API_V4_URL / GITLAB_GROUP_ID
#     passed INTO the container. net.hugmesh:hugmesh-commons is private, published
#     only to the org's GitLab Maven registry (not on Maven Central), and a fresh
#     container has an empty ~/.m2. Without them: "Could not find artifact
#     net.hugmesh:hugmesh-commons:jar:2.1.0 in central".
#   * the workspace is mounted READ-WRITE. Under `:ro` Maven's very first act,
#     creating target/, fails -- measured: `touch target/x` under that mount is
#     "Read-only file system" -- so no test would run and the
#     `target/surefire-reports/` artifact declared below could never have existed.
#   * `--user` + `HOME=/tmp`: without them the container writes target/ as root
#     into the shell executor's workspace, which breaks the next pipeline's
#     checkout, and drops a root-owned .m2 next to the sources.
test:
  stage: test
  tags: [hugmesh-x86, privileged]
  rules: *verify_rules
  script:
    # GITLAB_GROUP_ID is consumed by settings.xml (and by the Dockerfile, the
    # Makefile and scripts/native-build.sh) and is defined NOWHERE in this repo:
    # it has to exist as a GitLab CI/CD variable. Unset, settings.xml asks for
    # "${CI_API_V4_URL}/groups//-/packages/maven" and Maven reports the result as
    # a missing net.hugmesh:hugmesh-commons ARTIFACT rather than a missing
    # VARIABLE -- the misleading error the rest of this file exists to avoid.
    # build:native preflights all three vars inside scripts/native-build.sh;
    # this job is the one build:native `needs:`, so it checks here.
    - '[ -n "${GITLAB_GROUP_ID:-}" ] || { echo "GITLAB_GROUP_ID is unset. Set it as a CI/CD variable to the org group id whose GitLab Maven registry holds net.hugmesh:hugmesh-commons." >&2; exit 1; }'
    - >-
      docker run --rm
      --user "$(id -u):$(id -g)" -e HOME=/tmp
      -e CI_JOB_TOKEN -e CI_API_V4_URL -e GITLAB_GROUP_ID
      -v "${CI_PROJECT_DIR}:/workspace" -w /workspace
      eclipse-temurin:25-jdk-noble ./mvnw -B -s settings.xml verify
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 7 days

# GraalVM NATIVE build (issue #5). Before it, nothing compiled the pom's `native`
# profile / NativeHintsConfig, so a native regression only surfaced when somebody
# built an image by hand.
#
# It does not merely compile. scripts/native-build.sh compiles AND then RUNS the
# binary, twice, against a stub federation + Casdoor (scripts/NativeSmoke.java):
# once in SYNC_MODE=once (the initContainer shape -- assert the bundle files and
# index.json land on disk) and once in SYNC_MODE=loop (the sidecar shape --
# assert /actuator/health/readiness comes back UP over HTTP with
# FirstSyncHealthIndicator's live counters in it).
#
# Compiling alone proves very little: missing native reflection metadata does
# not fail native-image, it fails at first execution. Measured on two mutations
# of NativeHintsConfig, both of which native-image built as BUILD SUCCESS:
#   * drop the FederationManifest/.Remote hints -> binary exits 1,
#     "Record components not available for record class ...FederationManifest"
#   * drop the BundleMetadata hint             -> binary exits **0**, logs
#     "1 failed" and writes nothing. Only the on-disk assertions catch that one.
# An exit-status-only check would have passed the second mutation.
#
# Runs on every mirrored branch push, the default branch and tags (*verify_rules
# above): under pull-mirroring the bare $CI_COMMIT_BRANCH rule -- not
# merge_request_event -- is what makes this fire before the merge. Same
# shell-executor + docker shape as `test`; the GraalVM toolchain comes from the
# container image, so no runner needs GraalVM installed. `make native` runs the
# identical script locally.
build:native:
  stage: build
  needs: [test]
  tags: [hugmesh-x86, privileged]
  timeout: 45m
  rules: *verify_rules
  variables:
    GRAALVM_IMAGE: "ghcr.io/graalvm/graalvm-community:25"
    # Force the container path even if a runner happens to have GraalVM on PATH,
    # so every pipeline compiles against the same pinned toolchain.
    NATIVE_BUILD_IN_DOCKER: "1"
    # native-image otherwise sizes its heap at 80% of the RUNNER's RAM, which on
    # a shared privileged runner is a good way to OOM whatever else is building.
    NATIVE_IMAGE_OPTIONS: "-J-Xmx6g"
    # NATIVE_BUILD_M2 is deliberately NOT set. The script's fallback is a
    # throwaway Maven repo under HOME=/tmp inside the container, so every
    # pipeline resolves cold -- slower, but the alternative is a ~500 MB .m2
    # cached under CI_PROJECT_DIR, which test, build:native and build:sync all
    # share as ONE shell-executor workspace. The root .dockerignore added in this
    # same series does exclude `.m2/` (and `target/`), so such a cache would no
    # longer be swept into the `docker build` context of build:sync/build:nginx
    # -- that half of the objection is closed. What is NOT closed is workspace
    # hygiene: the cache would still be left behind for the next pipeline, and
    # this file pins neither GIT_STRATEGY nor GIT_CLEAN_FLAGS, so relying on
    # GitLab's default -ffdx to sweep it is an unstated dependency on runner
    # config. Cache here only if you pin those too.
    #
    # Cold resolution is only viable BECAUSE this job has a CI_JOB_TOKEN: the
    # one dependency that is not on Maven Central, net.hugmesh:hugmesh-commons,
    # comes from the org's GitLab registry via settings.xml, which the script
    # passes to Maven exactly when that token is present. (Off CI there is no
    # token, so the script bind-mounts the developer's ~/.m2 instead -- that
    # path never fires here.) The script preflights all three of
    # CI_JOB_TOKEN / CI_API_V4_URL / GITLAB_GROUP_ID before compiling, because
    # an empty GITLAB_GROUP_ID silently builds the URL ".../groups//-/packages/
    # maven" and Maven then reports the result as a missing ARTIFACT rather than
    # a missing VARIABLE. It also asserts CI_API_V4_URL is https (or an http
    # loopback): Maven 3.8+ blocks plain-http repositories and reports it as a
    # "Blocked mirror" nobody configured -- the same misleading-error class,
    # and this job has never run on a real runner, so it would be its first
    # ever output if this GitLab publishes an http API URL.
  script:
    - bash scripts/native-build.sh

build:sync:
  stage: build
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # The Dockerfile's build stage runs `./mvnw -B -s settings.xml package`, and
    # settings.xml interpolates ${CI_API_V4_URL} and ${GITLAB_GROUP_ID} into the
    # gitlab-maven repository URL and authenticates with the ci_job_token secret.
    # All three have to be handed to `docker build` explicitly -- ARG/secret
    # values are NOT inherited from the runner's environment. Without them
    # settings.xml resolves to ".../groups//-/packages/maven", Maven falls back
    # to Central and the build dies with "Could not find artifact
    # net.hugmesh:hugmesh-commons:jar:2.1.0 in central" (the same failure the
    # `test` and `build:native` jobs above guard against).
    #
    # The token goes in as a BuildKit SECRET, not an ARG, so it never lands in an
    # image layer or in this job's echoed command line. `,env=` needs Docker 23+;
    # on an older daemon it errors loudly (not silently) and the substitute is
    # `--secret id=ci_job_token,src=/dev/stdin` with `<<<"$CI_JOB_TOKEN"` appended.
    - '[ -n "${GITLAB_GROUP_ID:-}" ] || { echo "GITLAB_GROUP_ID is unset; the image build would report a missing ARTIFACT instead of a missing VARIABLE." >&2; exit 1; }'
    - >-
      DOCKER_BUILDKIT=1 docker build --pull
      --build-arg CI_API_V4_URL="$CI_API_V4_URL"
      --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID"
      --secret id=ci_job_token,env=CI_JOB_TOKEN
      -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

build:nginx:
  stage: build
  needs: [test]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/nginx:$TAG" -t "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_SLUG" nginx
    - docker push "$CI_REGISTRY_IMAGE/nginx:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage — thin jobs that extend the centralized hidden jobs from
# the generator's pentest-stage.gitlab-ci.yml (included above). allow_failure so
# a finding never blocks the build/image jobs; rules mirror this repo's existing
# security-job rules (default branch + merge requests).
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
