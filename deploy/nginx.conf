# hugmesh-remote-fragment — static server for the DB-hosted module-federation
# FRAGMENT bundles (user-profile/card + admin "contained pages", kind=fragment in
# the federation manifest). The sync sidecar pulls the ENABLED fragment set from
# the federation manifest/bundles API and writes it into this nginx root, content-
# addressed at /_fragments/<slug>/<contentHash>/...remoteEntry.json. The host's
# loadRemoteModule resolves the manifest remoteEntryUrl to these IMMUTABLE paths;
# cache invalidation is just a new contentHash path, and a disabled / circuit-
# broken / removed fragment drops out of the manifest (kill-switch honored).
#
# Modeled on hugmesh.systems/nginx.conf (listen 0.0.0.0:8080 + [::], gzip
# block, root /usr/share/nginx/html). Externalized here as a ConfigMap so the
# stock nginxinc/nginx-unprivileged image is used directly — no custom Dockerfile
# for the static container; the sync sidecar is the only first-party image.
server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    default_type application/octet-stream;

    # .mjs is NOT in the stock nginx mime.types, so ES-module remoteEntry/chunks
    # would otherwise be served as application/octet-stream and browsers refuse to
    # execute them under strict MIME checking (loadRemoteModule / import() fails).
    # Re-declare the JS/JSON/WASM types and add .mjs so module-federation bundles
    # always carry an executable JavaScript content-type.
    types {
        application/javascript js mjs;
        application/json       json map;
        application/wasm       wasm;
        text/css              css;
    }

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    # Fragments are JS/mjs/wasm bundles + their maps/css/json, so add
    # application/javascript and application/wasm over the host's gzip_types.
    gzip_types              text/plain text/css application/json application/javascript application/x-javascript application/wasm text/xml application/xml application/xml+rss text/javascript;
    gzip_buffers            16 8k;
    gunzip on;
    client_max_body_size    256M;

    root /usr/share/nginx/html;

    # Liveness/readiness probe target (the static container has no SPA index).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Content-addressed immutable bundles: a new bundle is a new contentHash path,
    # so far-future immutable caching is safe (cache-bust = a new path). NO SPA
    # fallback here — a missing fragment file 404s rather than returning index.html.
    location ~* ^/_fragments/[^/]+/[0-9a-f]+/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything else under /_fragments (e.g. the slug/hash dir listing miss) 404s.
    location /_fragments/ {
        try_files $uri =404;
    }

    # Pure static file server — no SPA index fallback (this fleet serves bundle
    # bytes only; the Angular host lives in the hugmesh-systems-web pod).
    location / {
        try_files $uri =404;
    }
}
