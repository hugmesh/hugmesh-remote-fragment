apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-frontend
resources:
  - deployment.yaml
  - hpa.yaml

# nginx.conf is materialized into a ConfigMap and mounted at
# /etc/nginx/conf.d/default.conf (route-access pattern) so the stock
# nginxinc/nginx-unprivileged image is used directly with no custom Dockerfile.
# Fixed name (disableNameSuffixHash) so ArgoCD self-heal does not churn the pod.
configMapGenerator:
  - name: remote-fragment-nginx
    files:
      - default.conf=nginx.conf
generatorOptions:
  disableNameSuffixHash: true

# First-party images now pull from the in-cluster GitLab container registry
# (registry.hugmesh.systems = the GitLab chart's hosts.domain default; project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the gitlab-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets). ONLY the first-party sync
# image is rewritten; the nginx container uses the public nginxinc/nginx-unprivileged.
images:
  - { name: hugmesh-net/hugmesh-remote-fragment, newName: registry.hugmesh.net/hugmesh/hugmesh-remote-fragment, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
