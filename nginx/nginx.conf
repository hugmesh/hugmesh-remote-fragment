# hugmesh-remote-fragment — static server for federated, DB-hosted fragment
# bundles. Modeled on the hugmesh.net host web nginx.conf
# (nginxinc/nginx-unprivileged, listen 8080, gzip block, root
# /usr/share/nginx/html) with the content-addressed immutable-cache additions for
# /_fragments/<slug>/<contentHash>/...
#
# Delivery model: SYNC-AND-SERVE-STATIC. The sync sidecar writes the current
# enabled-fragment set into /usr/share/nginx/html/_fragments/<slug>/<hash>/...; this
# server just returns those bytes. NO per-request proxy to federation. Because the
# path carries the content hash, every bundle URL is IMMUTABLE — a new bundle is a
# new path, so far-future caching is safe and cache-busting is just the new hash.
server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    server_name _;

    default_type application/octet-stream;

    # .mjs is NOT in the stock nginx mime.types, so ES-module remoteEntry/chunks
    # would otherwise be served as application/octet-stream and browsers refuse to
    # execute them under strict MIME checking (loadRemoteModule / import() fails).
    # Re-declare the JS/JSON/WASM types and add .mjs so module-federation bundles
    # always carry an executable JavaScript content-type.
    types {
        application/javascript js mjs;
        application/json       json map;
        application/wasm       wasm;
        text/css              css;
    }

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    # Host conf's set + application/javascript and application/wasm (fragments are
    # JS/wasm module-federation bundles) + svg + the JS source maps.
    gzip_types              text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_buffers            16 8k;
    gunzip on;

    client_max_body_size    256M;

    root /usr/share/nginx/html;

    # No directory listing anywhere on this server (fragment bytes only).
    autoindex off;

    # Liveness/readiness probe target for the nginx container.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The host reads this to discover slug -> current contentHash (+ servePath).
    # It is REWRITTEN every sync, so it must NOT be cached long.
    location = /_fragments/index.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Content-addressed immutable bundles: /_fragments/<slug>/<64-hex-hash>/...
    # The hash in the path makes the bytes immutable forever => far-future cache.
    # Pure static file server: NO SPA fallback (a missing fragment file 404s rather
    # than masquerading as an index).
    location ~* "^/_fragments/[^/]+/[0-9a-f]{8,}/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Any other /_fragments/* path (defensive): short cache, no fallback.
    location /_fragments/ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # The fleet serves ONLY fragment bundles + the index + the health probe.
    # Everything else is not found (it is not a SPA host).
    location / {
        return 404;
    }
}
